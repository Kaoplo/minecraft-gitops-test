apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agones
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://agones.dev/chart/stable
    chart: agones
    targetRevision: "1.61.0"

    helm:
      releaseName: agones
      valuesObject:
        gameservers:
          namespaces:
            - shulker-system
            - minecraft

        agones:
          allocator:
            install: true
            service:
              serviceType: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: agones-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
