apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shulker
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jeremylvln/Shulker.git
    targetRevision: v0.13.0
    path: kube/helm

    helm:
      releaseName: shulker

  destination:
    server: https://kubernetes.default.svc
    namespace: shulker-system

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/names/categories
        - /spec/names/shortNames

  syncPolicy:
    automated:
      selfHeal: true
      prune: false

    syncOptions:
      - CreateNamespace=true

